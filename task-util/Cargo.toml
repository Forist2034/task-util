[package]
name = "task-util"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
clap.workspace = true
http = "1.4.2"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net"] }
random_color = "1.1.0"
